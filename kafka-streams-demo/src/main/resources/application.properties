server.port=8090
spring.application.name=kafka-streams-demo

spring.kafka.streams.application-id=order-analytics

spring.kafka.streams.bootstrap-servers=localhost:9092

# Number of StreamThreads (each is a separate consumer in the group)
spring.kafka.streams.properties[num.stream.threads]=2

# Where RocksDB state stores are written on disk
spring.kafka.streams.properties[state.dir]=/tmp/kafka-streams