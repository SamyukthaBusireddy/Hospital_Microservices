spring.application.name=Prescription-Service

server.port=7001
eureka.client.service-url.defaultZone=  http://localhost:5001/eureka/
spring.datasource.url=jdbc:h2:file:./data/PrescriptionDB
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Log file
logging.file.name=logs/prescription-app.log
logging.file.path=logs

# Log levels
logging.level.root=INFO
logging.level.com.hospital.healthcare=DEBUG

# Log pattern
logging.pattern.file=%d{yyyy-MM-dd HH-mm-ss} [%thread] %-5level %logger{36} - %msg%n

# Rolling policy
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB


# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.url=/v3/api-docs
springdoc.swagger-ui.disable-swagger-default-url=true


# Optional
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha