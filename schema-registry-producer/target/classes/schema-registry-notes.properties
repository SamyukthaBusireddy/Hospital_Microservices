# ????????????????????????????????????????????????????????????????????????????????
# ?         KAFKA SCHEMA REGISTRY ? COMPLETE SENIOR-LEVEL NOTES               ?
# ?                    Part 1: In-Depth Explanation                            ?
# ????????????????????????????????????????????????????????????????????????????????
# ?  Covers: Why Schema Registry, Avro internals, Wire format, Compatibility  ?
# ?          modes, Schema Evolution, _schemas topic, Caching, Writer vs      ?
# ?          Reader schema resolution, Edge cases, HA setup                   ?
# ????????????????????????????????????????????????????????????????????????????????
#
#
# ???????????????????????????????????????????????????????????????????????????????
# 1. THE PROBLEM ? Why Do We Need Schema Registry?
# ???????????????????????????????????????????????????????????????????????????????
#
# Current setup (without Schema Registry):
#
#   Producer (Order.java)                   Consumer (Order.java)
#   ?????????????????????                   ?????????????????????
#     orderId: String                         orderId: String
#     customerId: String                      customerId: String
#     productId: String                       productId: String
#     quantity: Integer                       quantity: Integer
#     totalAmount: Double                     totalAmount: Double
#     status: String                          status: String
#         ?                                       ?
#         ? JsonSerializer                        ? JsonDeserializer
#         ?                                       ?
#     ?????????????????????????????????????????????
#     ?            Kafka (order-events)            ?
#     ? {"orderId":"O1","customerId":"C1",...}     ?
#     ?????????????????????????????????????????????
#
# This works TODAY because both sides have IDENTICAL classes.
# But in production, 5 scenarios WILL break this:
#
#
# ?????????????????????????????????????????????????
# SCENARIO 1: ADD a field
# ?????????????????????????????????????????????????
#   Producer V2: adds "shippingAddress: String"
#   Consumer V1: still has old Order.java (no shippingAddress)
#
#   Producer sends: {"orderId":"O1",...,"shippingAddress":"123 Main St"}
#   Consumer:       Jackson ignores unknown fields ? shippingAddress dropped
#
#   BUT: If consumer has @JsonProperty(required=true) or strict mode ? CRASH
#   WORSE: Nobody knows this is happening until production breaks.
#
#
# ?????????????????????????????????????????????????
# SCENARIO 2: REMOVE a field
# ?????????????????????????????????????????????????
#   Producer V2: removes "status" field
#   Consumer V1: still expects "status"
#
#   Producer sends: {"orderId":"O1","customerId":"C1",...}  ? no "status"
#   Consumer:       status = null
#
#   Is null OK? Maybe. Maybe not. Nobody validated this.
#
#
# ?????????????????????????????????????????????????
# SCENARIO 3: RENAME a field
# ?????????????????????????????????????????????????
#   Producer V2: renames "totalAmount" ? "amount"
#   Consumer V1: still looks for "totalAmount"
#
#   Producer sends: {"amount": 99.0}
#   Consumer:       totalAmount = null ? SILENT DATA LOSS
#
#
# ?????????????????????????????????????????????????
# SCENARIO 4: CHANGE a field type
# ?????????????????????????????????????????????????
#   Producer V2: changes quantity from Integer ? String ("5 units")
#   Consumer V1: expects Integer
#
#   Producer sends: {"quantity": "5 units"}
#   Consumer:       JsonMappingException ? CRASH
#
#
# ?????????????????????????????????????????????????
# SCENARIO 5: MULTIPLE consumers, different teams
# ?????????????????????????????????????????????????
#                         ?? Consumer A (Order Service) ? needs all fields
#   order-events ??????????? Consumer B (Analytics)     ? needs orderId + totalAmount
#                         ?? Consumer C (Shipping)      ? needs orderId + shippingAddress
#
#   Who decides what the "correct" schema is?
#   Who validates that a producer change won't break Consumer A, B, or C?
#   Answer: NOBODY. It's chaos.
#
#
# THE ROOT CAUSE:
    #   JSON is SCHEMA-LESS. There's no contract.
#   The producer can send ANY JSON. The consumer HAS to hope it matches.
#   No validation, no versioning, no compatibility checks.
#
#
# ???????????????????????????????????????????????????????????????????????????????
# 2. THE SOLUTION ? Schema Registry
# ???????????????????????????????????????????????????????????????????????????????
#
# Schema Registry adds ONE simple rule:
#
#   "Every message has a SCHEMA, and that schema is VALIDATED
#    BEFORE the message is published to Kafka."
#
# WITHOUT Schema Registry:
#   Producer ? serialize (any JSON) ? Kafka ? deserialize (hope it works) ? Consumer
#
# WITH Schema Registry:
#   Producer ? check schema compatibility ? serialize ? Kafka ? deserialize ? Consumer
#                      ?                                            ?
#                      ?       ????????????????????                 ?
#                      ?????????  Schema Registry  ??????????????????
#                              ?  (HTTP REST API)  ?
#                              ????????????????????
#                                       ?
#                              ????????????????????
#                              ?  _schemas topic   ?
#                              ?  (Kafka internal) ?
#                              ????????????????????
#
# Think of it like DATABASE MIGRATIONS:
#   - Database: you don't change column types randomly.
#     You write migrations with rules.
#   - Schema Registry: you don't change message fields randomly.
#     You register schemas with compatibility rules.
#
#
# ???????????????????????????????????????????????????????????????????????????????
# 3. WHAT IS A SCHEMA? ? Three Formats
# ???????????????????????????????????????????????????????????????????????????????
#
# A schema is a FORMAL DEFINITION of the structure of your data.
#
# ?????????????????????????????????????????????????
# FORMAT 1: Avro (most popular with Kafka)
# ?????????????????????????????????????????????????
#   {
#     "type": "record",
#     "name": "Order",
#     "namespace": "com.eda.schema",
#     "fields": [
#       {"name": "orderId",     "type": "string"},
#       {"name": "customerId",  "type": "string"},
#       {"name": "productId",   "type": "string"},
#       {"name": "quantity",    "type": "int"},
#       {"name": "totalAmount", "type": "double"},
#       {"name": "status",      "type": "string"}
#     ]
#   }
#
#
# ?????????????????????????????????????????????????
# FORMAT 2: Protobuf (Google's format)
# ?????????????????????????????????????????????????
#   message Order {
#     string orderId = 1;
#     string customerId = 2;
#     string productId = 3;
#     int32 quantity = 4;
#     double totalAmount = 5;
#     string status = 6;
#   }
#
#
# ?????????????????????????????????????????????????
# FORMAT 3: JSON Schema
# ?????????????????????????????????????????????????
#   {
#     "type": "object",
#     "properties": {
#       "orderId":     {"type": "string"},
#       "customerId":  {"type": "string"},
#       "totalAmount": {"type": "number"}
#     },
#     "required": ["orderId"]
#   }
#
#
# ?????????????????????????????????????????????????
# COMPARISON TABLE
# ?????????????????????????????????????????????????
#
#   ???????????????????????????????????????????????????????????????????????????????
#   ? Format       ? Serialization  ? Size  ? Schema Evolution ? Kafka Ecosystem  ?
#   ???????????????????????????????????????????????????????????????????????????????
#   ? Avro         ? Binary         ? Small ? Excellent        ? First-class      ?
#   ? Protobuf     ? Binary         ? Small ? Good             ? Good             ?
#   ? JSON Schema  ? Text (JSON)    ? Large ? Limited          ? Supported        ?
#   ? Raw JSON     ? Text (JSON)    ? Large ? None             ? No validation    ?
#   ???????????????????????????????????????????????????????????????????????????????
#
# WHY AVRO IS THE STANDARD FOR KAFKA:
#   - Binary format ? 3-10x smaller than JSON
#   - Schema stored separately ? no field names in every message
#   - Built-in evolution rules ? can add/remove fields safely
#   - Confluent Schema Registry was designed for Avro first
#
#
# ???????????????????????????????????????????????????????????????????????????????
# 4. SCHEMA REGISTRY ARCHITECTURE ? How It Works Internally
# ???????????????????????????????????????????????????????????????????????????????
#
# Schema Registry is a SEPARATE SERVICE (not part of Kafka brokers).
# It runs as its own process, typically on port 8081 (we use 8085).
#
#   ???????????????     ????????????????????     ???????????????
#   ?   Producer   ???????  Schema Registry  ???????   Consumer   ?
#   ?  (serializer)?     ?   (HTTP REST API) ?     ?(deserializer)?
#   ???????????????     ????????????????????     ???????????????
#          ?                     ?                       ?
#          ?                     ?                       ?
#          ?            ??????????????????               ?
#          ?            ?  _schemas topic ?               ?
#          ?            ?  (Kafka internal)?              ?
#          ?            ??????????????????               ?
#          ?                                             ?
#          ????????????????? Kafka ???????????????????????
#                       (data topics: order-events-avro)
#
# Three responsibilities:
#   1. Exposes a REST API (HTTP) for schema CRUD operations
#   2. Stores all schemas in a Kafka topic called "_schemas"
#   3. Assigns each schema version a GLOBALLY UNIQUE ID (integer)
#
#
# ?????????????????????????????????????????????????
# 4.1 PRODUCER SIDE ? Serialization Flow
# ?????????????????????????????????????????????????
#
# When producer calls: kafkaTemplate.send("order-events-avro", key, order)
#
#   Step 1: KafkaAvroSerializer.serialize() is invoked
#
#   Step 2: Serializer extracts schema from the Avro object
#           ? order.getSchema()
#           ? Returns the Avro schema (embedded in the generated Order.java class)
#
#   Step 3: Serializer builds the SUBJECT name
#           ? subject = topicName + "-value" = "order-events-avro-value"
#           ? (for key serializer, it would be "order-events-avro-key")
#
#   Step 4: Check LOCAL CACHE
#           ? Cache key = (subject + schema fingerprint)
#           ? First time? CACHE MISS ? go to Step 5
#           ? Already seen? CACHE HIT ? jump to Step 7 (no HTTP call!)
#
#   Step 5: Call Schema Registry REST API
#           ? POST http://localhost:8085/subjects/order-events-avro-value/versions
#           ? Body: { "schema": "{\"type\":\"record\",\"name\":\"Order\",...}" }
#
#   Step 6: Schema Registry processes the request:
#           ? Is this the FIRST version? ? Register it, assign ID=1, return { "id": 1 }
#           ? Schema already exists? ? Return existing { "id": 1 }
#           ? New version? ? Check COMPATIBILITY with previous versions
#             ? Compatible? ? Register new version, assign new ID, return it
#             ? Incompatible? ? Return 409 CONFLICT ? serializer throws exception!
#
#   Step 7: Cache the mapping: (subject + schema) ? ID=1
#
#   Step 8: Serialize the object to Avro BINARY format
#           ? No field names! Just values in schema-defined order.
#
#   Step 9: Prepend 5-byte header:
#           ????????????????????????????????????????????????
#           ? 0x00 ? 0x00 0x00 0x00 0x01 ? <avro binary>  ?
#           ? magic?   schema ID = 1     ?   (data)        ?
#           ? (1B) ?    (4 bytes)        ?                 ?
#           ????????????????????????????????????????????????
#
#   Step 10: Return the complete byte[] to Kafka producer ? sent to broker
#
#
# ?????????????????????????????????????????????????
# 4.2 CONSUMER SIDE ? Deserialization Flow
# ?????????????????????????????????????????????????
#
# When consumer polls and receives raw bytes:
#
#   Step 1: KafkaAvroDeserializer.deserialize() is invoked
#
#   Step 2: Read first byte: 0x00
#           ? Magic byte confirms "this message uses Schema Registry format"
#           ? If first byte is NOT 0x00 ? deserialization error!
#             (This is why you can't mix JSON and Avro messages in same topic)
#
#   Step 3: Read next 4 bytes: schema ID (big-endian int32)
#           ? e.g., 0x00 0x00 0x00 0x01 ? schema ID = 1
#
#   Step 4: Check LOCAL CACHE
#           ? Cache key = schema ID
#           ? First time seeing ID=1? CACHE MISS ? go to Step 5
#           ? Already cached? CACHE HIT ? jump to Step 6
#
#   Step 5: Call Schema Registry REST API
#           ? GET http://localhost:8085/schemas/ids/1
#           ? Response: the full Avro schema definition
#           ? Cache it: ID=1 ? schema
#
#   Step 6: Use the schema to decode the remaining Avro binary bytes
#           ? Schema tells the deserializer: field order, field types, field names
#           ? Produces either:
#             a) GenericRecord (if specific.avro.reader=false) ? like a Map
#             b) Generated Order class (if specific.avro.reader=true) ? typed object
#
#   Step 7: Consumer receives the Order object with all fields correctly typed

#
#
# ???????????????????????????????????????????????????????????????????????????????
# 5. AVRO BINARY FORMAT ? What Actually Goes On The Wire
# ???????????????????????????????????????????????????????????????????????????????
#
# Let's take a concrete example. Our Order object:
#   orderId = "O-101"
#   customerId = "C-1"
#   productId = "P-1"
#   quantity = 2
#   totalAmount = 250.0
#   status = "NEW"
#
#
# ?????????????????????????????????????????????????
# 5.1 JSON vs Avro ? What bytes are on the wire?
# ?????????????????????????????????????????????????
#
# JSON on the wire (what we had before):
#   {"orderId":"O-101","customerId":"C-1","productId":"P-1","quantity":2,"totalAmount":250.0,"status":"NEW"}
#   ? 100+ bytes
#   ? Contains field names IN EVERY MESSAGE
#   ? Human-readable but WASTEFUL
#
# Avro on the wire:
#   [0x00][0x00 0x00 0x00 0x01][0A 4F 2D 31 30 31 06 43 2D 31 06 50 2D 31 04 00 00 00 00 40 6F 40 00 06 4E 45 57]
#   |magic|   schema ID = 1   |                    binary data (no field names!)                                  |
#   ? ~32 bytes
#   ? NO field names. Values only. In schema-defined order.
#   ? 3x smaller than JSON
#
#
# ?????????????????????????????????????????????????
# 5.2 How Avro encodes each type
# ?????????????????????????????????????????????????
#
#   ???????????????????????????????????????????????????????????????????????
#   ? Type     ? Encoding                                                ?
#   ???????????????????????????????????????????????????????????????????????
#   ? null     ? 0 bytes (nothing written!)                              ?
#   ? boolean  ? 1 byte: 0x00 = false, 0x01 = true                      ?
#   ? int      ? Variable-length zigzag encoding (1-5 bytes)             ?
#   ? long     ? Variable-length zigzag encoding (1-10 bytes)            ?
#   ? float    ? 4 bytes (IEEE 754)                                      ?
#   ? double   ? 8 bytes (IEEE 754)                                      ?
#   ? string   ? Length (zigzag int) + UTF-8 bytes                       ?
#   ? bytes    ? Length (zigzag int) + raw bytes                          ?
#   ? union    ? Index of type in union (zigzag int) + value bytes       ?
#   ???????????????????????????????????????????????????????????????????????
#
# ZIGZAG ENCODING (important for interviews):
#   Normal int encoding wastes bytes for small numbers.
#   Zigzag maps signed integers to unsigned, then uses variable-length encoding:
#     0 ? 0, -1 ? 1, 1 ? 2, -2 ? 3, 2 ? 4, ...
#   So small numbers (positive or negative) use fewer bytes:
#     quantity = 2 ? zigzag(2) = 4 ? encoded as single byte: 0x04
#     quantity = 200 ? zigzag(200) = 400 ? encoded as 2 bytes
#
#
# ?????????????????????????????????????????????????
# 5.3 Union types ? How optional fields work
# ?????????????????????????????????????????????????
#
#   Schema: {"name": "shippingAddress", "type": ["null", "string"], "default": null}
#
#   This is a UNION type: ["null", "string"]
#   Index 0 = null, Index 1 = string
#
#   When value is NULL:
#     Binary: [0x00]         ? union index 0 (null), then nothing (null = 0 bytes)
#
#   When value is "123 Main St":
#     Binary: [0x02][0x16 31 32 33 20 4D 61 69 6E 20 53 74]
#              ?      ?
#              ?      ?? string bytes ("123 Main St" = 11 chars, length=0x16 zigzag)
#              ??? union index 1 (string)
#
#   KEY INSIGHT: null is NOT "missing bytes." It is explicitly encoded as
#   union index 0. The binary ALWAYS has every field in the writer schema.
#
#
# ???????????????????????????????????????????????????????????????????????????????
# 6. WRITER SCHEMA vs READER SCHEMA ? The Core Resolution Mechanism
# ???????????????????????????????????????????????????????????????????????????????
#
# This is THE most important concept in Avro and Schema Registry.
#
# DEFINITIONS:
#
#   Writer Schema = the schema that was used to SERIALIZE the message
#                 = stored in Schema Registry, identified by the schema ID
#                   in the message header
#                 = the producer's schema at the TIME of writing
#
#   Reader Schema = the schema that the CONSUMER has compiled locally
#                 = from the .avsc file ? generated Order.java
#                 = the consumer's CURRENT understanding of the data
#
#
# WHY DO WE NEED TWO SCHEMAS?
#
#   Because producer and consumer EVOLVE INDEPENDENTLY.
#
#   Timeline:
#     Jan:  Producer V1 (6 fields)  ?  Consumer V1 (6 fields)   ? same schema
#     Mar:  Producer V2 (7 fields)  ?  Consumer V1 (6 fields)   ? DIFFERENT
#     May:  Producer V2 (7 fields)  ?  Consumer V2 (7 fields)   ? same again
#     Jul:  Producer V2 (7 fields)  ?  Consumer V3 (8 fields)   ? DIFFERENT
#
#   At any point, Kafka has messages from MULTIPLE schema versions:
#     offset 0-99:    written with schema ID=1 (V1)
#     offset 100-199: written with schema ID=2 (V2)
#
#   Consumer V3 must read ALL of them correctly.
#
#
# ?????????????????????????????????????????????????
# 6.1 RESOLUTION ALGORITHM (step by step)
# ?????????????????????????????????????????????????
#
#   Consumer reads a message from Kafka:
#
#   Step 1: Extract schema ID from the 5-byte header
#           ? schema ID = 1
#
#   Step 2: Fetch Writer Schema from Schema Registry (or cache)
#           ? GET /schemas/ids/1 ? returns V1 schema (6 fields)
#
#   Step 3: Get Reader Schema (local, compiled into the consumer's code)
#           ? Consumer's Order.java has 8 fields (V3)
#
#   Step 4: Are they the SAME schema?
#           ? YES ? read binary directly using that schema (fast path)
#           ? NO  ? do RESOLUTION (Step 5)
#
#   Step 5: RESOLUTION ? match fields BY NAME, not by position
#
#           Writer Schema (V1)          Reader Schema (V3)
#           ??????????????????          ??????????????????
#           orderId (string)      ?    orderId (string)        ? name match
#           customerId (string)   ?    customerId (string)     ? name match
#           productId (string)    ?    productId (string)      ? name match
#           quantity (int)        ?    quantity (int)           ? name match
#           totalAmount (double)  ?    totalAmount (double)    ? name match
#           status (string)       ?    status (string)         ? name match
#           (not in V1)           ?    shippingAddress          ? use default
#           (not in V1)           ?    priority                 ? use default
#
#   Step 6: Read the binary bytes using WRITER schema (position-based)
#           ? position 0 ? string ? orderId = "O-101"
#           ? position 1 ? string ? customerId = "C-1"
#           ? ... reads all 6 fields
#
#   Step 7: Map the values to READER schema (name-based)
#           ? orderId = "O-101"       (matched by name)
#           ? shippingAddress = null   (not in writer ? use default)
#           ? priority = "NORMAL"      (not in writer ? use default)
#
#
# ?????????????????????????????????????????????????
# 6.2 FOUR POSSIBLE SCENARIOS during resolution
# ?????????????????????????????????????????????????
#
#   ????????????????????????????????????????????????????????????????????????????
#   ? Scenario                        ? What happens                           ?
#   ????????????????????????????????????????????????????????????????????????????
#   ? Field in BOTH writer & reader   ? Read from binary, map by name     ?  ?
#   ? Field in WRITER only            ? Read from binary, then IGNORED    ?  ?
#   ? Field in READER only + default  ? Use default value                 ?  ?
#   ? Field in READER only, NO default? ERROR! AvroTypeException          ?  ?
#   ????????????????????????????????????????????????????????????????????????????
#
#   The last row is why BACKWARD compatibility requires defaults on new fields.
#
#
# CRITICAL INSIGHT:
#
#   Binary bytes are read using WRITER schema ? by POSITION (field order matters)
#   Values are mapped to READER schema       ? by NAME (position doesn't matter)
#
#   This is why:
#   - Adding a field in the MIDDLE of the reader schema is fine
#   - Reordering fields in the reader schema is fine
#   - The only thing that matters is: can every reader field be satisfied?
#     (either from writer data by name match, or from a default)
#
#
# ???????????????????????????????????????????????????????????????????????????????
# 7. COMPATIBILITY MODES ? The Rules of Schema Evolution
# ???????????????????????????????????????????????????????????????????????????????
#
# When you register a NEW version of a schema, Schema Registry checks if it's
# COMPATIBLE with previous versions. The compatibility MODE defines the rules.
#
# Default mode: BACKWARD (can be changed per-subject or globally)
#
#
# ?????????????????????????????????????????????????
# 7.1 BACKWARD COMPATIBILITY (default)
# ?????????????????????????????????????????????????
#
# Rule: New schema (reader) can read data written by old schema (writer)
# Think: "Can the NEW consumer read OLD messages?"
#
# ALLOWED changes:
#   ? ADD a field WITH a default value
#      V1: {orderId, customerId, quantity}
#      V2: {orderId, customerId, quantity, shippingAddress(default=null)}
#      ? Consumer V2 reads V1 message ? shippingAddress = null (default) ?
#
#   ? REMOVE a field (any field)
#      V1: {orderId, customerId, quantity, status}
#      V2: {orderId, customerId, quantity}   ? status removed
#      ? Consumer V2 reads V1 message ? status is in binary, but IGNORED ?
#
# FORBIDDEN changes:
#   ? ADD a field WITHOUT a default
#      V2: {orderId, customerId, quantity, shippingAddress}   ? no default!
#      ? Consumer V2 reads V1 message ? no shippingAddress in binary,
#        no default ? AvroTypeException!
#      ? Schema Registry REJECTS this schema: 409 CONFLICT
#
#   ? CHANGE field type incompatibly
#      V1: quantity is int
#      V2: quantity is string
#      ? binary has int bytes, reader expects string ? crash
#
# USE CASE: "Consumer deploys first" pattern
#   ? Deploy consumer V2, then producer V2
#   ? Consumer V2 can read both V1 and V2 messages
#
#
# ?????????????????????????????????????????????????
# 7.2 FORWARD COMPATIBILITY
# ?????????????????????????????????????????????????
#
# Rule: Old schema (reader) can read data written by new schema (writer)
# Think: "Can the OLD consumer read NEW messages?"
#
# ALLOWED changes:
#   ? ADD a field (with or without default)
#      ? Old consumer reads new message ? extra field in binary, IGNORED ?
#
#   ? REMOVE a field WITH a default
#      ? Old consumer reads new message ? field missing ? use default ?
#
# FORBIDDEN changes:
#   ? REMOVE a field WITHOUT a default
#      ? Old consumer reads new message ? field missing, no default ? crash
#
# USE CASE: "Producer deploys first" pattern
#   ? Deploy producer V2, then consumer V2
#   ? Old consumer V1 can read new V2 messages
#
#
# ?????????????????????????????????????????????????
# 7.3 FULL COMPATIBILITY
# ?????????????????????????????????????????????????
#
# Rule: BOTH backward AND forward compatible
# Think: "OLD and NEW consumers can read OLD and NEW messages"
#
# ALLOWED changes:
#   ? ADD a field WITH a default (backward: reader uses default)
#   ? REMOVE a field WITH a default (forward: old reader uses default)
#
# FORBIDDEN changes:
#   ? ADD a field WITHOUT a default (breaks backward)
#   ? REMOVE a field WITHOUT a default (breaks forward)
#
# USE CASE: Zero-downtime deployments (most production systems)
#   ? Don't care about deploy order
#   ? Both old and new versions work simultaneously
#
#
# ?????????????????????????????????????????????????
# 7.4 TRANSITIVE variants
# ?????????????????????????????????????????????????
#
# Non-transitive (default): checks compatibility ONLY against the LAST version
#   V1 ? V2 compatible? ?
#   V2 ? V3 compatible? ?
#   But V1 ? V3 might NOT be compatible! (problem if old V1 messages still in Kafka)
#
# Transitive: checks compatibility against ALL previous versions
#   V1 ? V3 compatible? ?
#   V2 ? V3 compatible? ?
#   BOTH must pass
#
# Available modes:
#   BACKWARD             ? check against last version only
#   BACKWARD_TRANSITIVE  ? check against ALL previous versions
#   FORWARD              ? check against last version only
#   FORWARD_TRANSITIVE   ? check against ALL previous versions
#   FULL                 ? check against last version only
#   FULL_TRANSITIVE      ? check against ALL previous versions
#   NONE                 ? no checks at all (?? dangerous in production!)
#
#
# ?????????????????????????????????????????????????
# 7.5 MASTER COMPATIBILITY TABLE
# ?????????????????????????????????????????????????
#
#   ????????????????????????????????????????????????????????????????????????????????????????
#   ? Change               ? BACKWARD          ? FORWARD          ? FULL                   ?
#   ????????????????????????????????????????????????????????????????????????????????????????
#   ? Add field + default  ? ? Allowed        ? ? Allowed       ? ? Allowed             ?
#   ? Add field no default ? ? REJECTED       ? ? Allowed       ? ? REJECTED            ?
#   ? Remove field + dflt  ? ? Allowed        ? ? Allowed       ? ? Allowed             ?
#   ? Remove field no dflt ? ? Allowed        ? ? REJECTED      ? ? REJECTED            ?
#   ? Rename field         ? ? REJECTED       ? ? REJECTED      ? ? REJECTED            ?
#   ? Change type          ? ? REJECTED*      ? ? REJECTED*     ? ? REJECTED*           ?
#   ????????????????????????????????????????????????????????????????????????????????????????
#   * Some promotions are allowed: int?long, int?float, int?double, long?double, float?double
#
#
# ?????????????????????????????????????????????????
# 7.6 HOW TO SET COMPATIBILITY MODE
# ?????????????????????????????????????????????????
#
#   Global default:
#     PUT http://localhost:8085/config
#     Body: {"compatibility": "FULL"}
#
#   Per-subject override:
#     PUT http://localhost:8085/config/order-events-avro-value
#     Body: {"compatibility": "BACKWARD_TRANSITIVE"}
#
#   Check current mode:
#     GET http://localhost:8085/config
#     GET http://localhost:8085/config/order-events-avro-value
#
#   Test compatibility BEFORE registering:
#     POST http://localhost:8085/compatibility/subjects/order-events-avro-value/versions/latest
#     Body: {"schema": "..."}
#     ? Returns: {"is_compatible": true} or {"is_compatible": false}
#
#
# ???????????????????????????????????????????????????????????????????????????????
# 8. THE _schemas TOPIC ? Schema Registry's Storage Backend
# ???????????????????????????????????????????????????????????????????????????????
#
# Schema Registry does NOT use a database. It stores everything in a Kafka topic
# called "_schemas". This is genius because:
#   - Kafka is already there (no extra infrastructure)
#   - Gets Kafka's durability, replication, fault-tolerance for free
#   - Multiple Schema Registry instances can read from the same topic (HA)
#
# TOPIC CONFIGURATION:
#   - Partitions: 1 (single partition ? ordering matters!)
#   - Replication factor: 3 (or min(3, num_brokers))
#   - Cleanup policy: compact (keeps latest value per key, like __consumer_offsets)
#
# RECORD FORMAT:
#   Key:   {"keytype": "SCHEMA", "subject": "order-events-avro-value", "version": 1}
#   Value: {
#     "subject":    "order-events-avro-value",
#     "version":    1,
#     "id":         1,           ? global unique ID
#     "schema":     "{\"type\":\"record\",\"name\":\"Order\",...}",
#     "deleted":    false
#   }
#
# Other key types:
#   {"keytype": "CONFIG", "subject": "order-events-avro-value"}  ? compatibility config
#   {"keytype": "CONFIG", "subject": null}                       ? global config
#   {"keytype": "NOOP"}                                          ? dummy record for leader election
#
#
# HOW SCHEMA REGISTRY BOOTS UP:
#   1. Reads ALL records from _schemas topic from beginning
#   2. Builds in-memory maps:
#      - schemas by ID: {1 ? schema, 2 ? schema, ...}
#      - schemas by subject: {"order-events-avro-value" ? [v1, v2], ...}
#      - compatibility configs per subject
#   3. Ready to serve requests
#   4. Continues consuming from _schemas to stay in sync
#      (if another Schema Registry instance writes a new schema)
#
# INSPECT IT:
#   /tmp/kafka_2.13-4.2.0/bin/kafka-console-consumer.sh \
#     --bootstrap-server localhost:9092 \
#     --topic _schemas --from-beginning \
#     --property print.key=true
#
#
# ???????????????????????????????????????????????????????????????????????????????
# 9. SUBJECT NAMING STRATEGIES ? How Schemas Map To Topics
# ???????????????????????????????????????????????????????????????????????????????
#
# A "subject" is the unit of schema evolution. Compatibility is checked
# within a subject. The naming strategy determines how subjects are named.
#
#
# ?????????????????????????????????????????????????
# Strategy 1: TopicNameStrategy (DEFAULT)
# ?????????????????????????????????????????????????
#   Subject = topicName + "-key" or topicName + "-value"
#   Example: topic "order-events-avro" ? subject "order-events-avro-value"
#
#   Behavior: ONE schema per topic
#   ? All messages in a topic must conform to the same schema
#   ? Different topics can have different schemas
#
#   This is what we use. Simplest and most common.
#
#
# ?????????????????????????????????????????????????
# Strategy 2: RecordNameStrategy
# ?????????????????????????????????????????????????
#   Subject = fully qualified record name
#   Example: "com.eda.schema.Order"
#
#   Behavior: MULTIPLE schemas per topic
#   ? Same topic can have Order, Payment, Shipment events
#   ? Each record type evolves independently
#   ? Useful for event sourcing (one topic, many event types)
#
#   Config: value.subject.name.strategy=
#           io.confluent.kafka.serializers.subject.RecordNameStrategy
#
#
# ?????????????????????????????????????????????????
# Strategy 3: TopicRecordNameStrategy
# ?????????????????????????????????????????????????
#   Subject = topicName + "-" + record name
#   Example: "order-events-avro-com.eda.schema.Order"
#
#   Behavior: Same record name in different topics can evolve differently
#   ? Rarely used, very specific use cases
#
#
# ???????????????????????????????????????????????????????????????????????????????
# 10. CACHING ? Why Schema Registry Is NOT a Bottleneck
# ???????????????????????????????????????????????????????????????????????????????
#
# Common concern: "Every message calls Schema Registry? Won't it be slow?"
# Answer: NO. Because of aggressive caching on BOTH sides.
#
#
# PRODUCER-SIDE CACHE:
#   Cache key:   (subject + schema hash)
#   Cache value: schema ID
#
#   First message: POST to Schema Registry ? get ID=1 ? cache it
#   Second message: cache HIT ? use ID=1 ? NO HTTP call
#   Third message: cache HIT ? use ID=1 ? NO HTTP call
#   ...
#
#   As long as the schema doesn't change, the producer NEVER calls
#   Schema Registry again. Only the very first message triggers a call.
#
#
# CONSUMER-SIDE CACHE:
#   Cache key:   schema ID
#   Cache value: parsed schema
#
#   First time seeing ID=1: GET /schemas/ids/1 ? parse ? cache it
#   Next time seeing ID=1: cache HIT ? NO HTTP call
#   First time seeing ID=2: GET /schemas/ids/2 ? parse ? cache it
#   Next time seeing ID=2: cache HIT ? NO HTTP call
#
#   So the consumer makes at most ONE HTTP call per unique schema ID.
#   For most topics, that's 1-5 calls in the entire lifetime of the consumer.
#
#
# REAL-WORLD NUMBERS:
#   - Producer sending 100,000 msgs/sec ? 1 HTTP call total (the first one)
#   - Consumer reading 100,000 msgs/sec ? 1 HTTP call total (the first one)
#   - Schema Registry handles ~100 requests per LIFETIME per client, not per second
#
#   The only time Schema Registry gets hit is:
#     1. First message from a producer (register/lookup schema)
#     2. First message with a new schema ID at the consumer
#     3. Application restart (caches are in-memory, lost on restart)
#
#
# ???????????????????????????????????????????????????????????????????????????????
# 11. EDGE CASES & GOTCHAS ? What Can Go Wrong
# ???????????????????????????????????????????????????????????????????????????????
#
#
# ?????????????????????????????????????????????????
# EDGE CASE 1: Schema Registry is DOWN
# ?????????????????????????????????????????????????
#
#   Producer (first message, cache empty):
#     ? Cannot register schema ? serialize() throws exception
#     ? Message is NOT sent to Kafka
#     ? Application error
#
#   Producer (cache warm, schema already registered):
#     ? Uses cached schema ID ? serialize() works ? message sent ?
#     ? Schema Registry being down doesn't matter if cache is warm
#
#   Consumer (first time seeing a schema ID, cache empty):
#     ? Cannot fetch schema ? deserialize() throws exception
#     ? Message is NOT processed
#     ? Consumer retries (depends on error handler config)
#
#   Consumer (cache warm):
#     ? Uses cached schema ? works fine ?
#
#   PRODUCTION TIP: Run multiple Schema Registry instances behind a load
#   balancer for HA. But even with a single instance, the caching means
#   short outages have minimal impact on warm producers/consumers.
#
#
# ?????????????????????????????????????????????????
# EDGE CASE 2: Mixing JSON and Avro in the same topic
# ?????????????????????????????????????????????????
#
#   DON'T. The Avro deserializer checks the first byte (magic byte = 0x00).
#   JSON messages start with '{' (0x7B) ? immediate deserialization error.
#
#   If you MUST migrate from JSON to Avro on the same topic:
#     ? Create a new topic for Avro messages
#     ? Dual-write during migration (both old JSON and new Avro topic)
#     ? Switch consumers to new topic
#     ? Stop writing to old topic
#
#
# ?????????????????????????????????????????????????
# EDGE CASE 3: Schema ID exhaustion
# ?????????????????????????????????????????????????
#
#   Schema IDs are 32-bit integers ? max 2,147,483,647
#   At 100 new schemas per day ? 58,000+ YEARS before exhaustion
#   Not a real concern.
#
#
# ?????????????????????????????????????????????????
    # EDGE CASE 4: Deleting a schema version
# ?????????????????????????????????????????????????
#
#   SOFT DELETE: marks version as deleted, but schema ID still resolves
#     DELETE /subjects/order-events-avro-value/versions/1
#     ? Consumers can still read old messages (schema ID still works)
#     ? Can't register new schemas as this version
#
#   HARD DELETE: permanently removes (requires soft delete first)
#     DELETE /subjects/order-events-avro-value/versions/1?permanent=true
#     ? ?? DANGEROUS: consumers reading old messages will get errors
#     ? Only use after all messages with this schema ID have expired
#
#
# ?????????????????????????????????????????????????
# EDGE CASE 5: Same schema registered under different subjects
# ?????????????????????????????????????????????????
#
#   Two topics with same schema ? TWO different subjects:
#     "order-events-avro-value" ? ID=1
#     "order-events-backup-value" ? ID=2
#
#   Even though the schema JSON is identical, each gets its OWN ID.
#   (unless you use schema references, an advanced feature)
#
#   They evolve independently ? changing one doesn't affect the other.
#
#
# ?????????????????????????????????????????????????
# EDGE CASE 6: GenericRecord vs SpecificRecord
# ?????????????????????????????????????????????????
#
#   specific.avro.reader=true  ? returns generated Order.java (typed)
#     ? order.getOrderId()     ? compile-time safe
#     ? Requires .avsc + maven plugin + generated class
#
#   specific.avro.reader=false ? returns GenericRecord (like a Map)
#     ? record.get("orderId")  ? runtime string lookup, no type safety
#     ? No need for .avsc file or generated classes
#     ? Useful for generic consumers that process multiple event types
#
#
# ???????????????????????????????????????????????????????????????????????????????
# 12. HIGH AVAILABILITY ? Production Schema Registry Setup
# ???????????????????????????????????????????????????????????????????????????????
#
# Schema Registry uses a LEADER-FOLLOWER model (not like Kafka's ISR).
#
# ARCHITECTURE:
#
#   ???????????????????  ???????????????????  ???????????????????
#   ? Schema Registry  ?  ? Schema Registry  ?  ? Schema Registry  ?
#   ?   (LEADER)       ?  ?  (FOLLOWER)      ?  ?  (FOLLOWER)      ?
#   ?   port 8085      ?  ?   port 8086      ?  ?   port 8087      ?
#   ????????????????????  ????????????????????  ????????????????????
#            ?                     ?                       ?
#            ???????????????????????????????????????????????
#                                  ?
#                          ?????????????????
#                          ? _schemas topic ?
#                          ?  (Kafka)       ?
#                          ?????????????????
#
# WRITE operations (register schema, update config):
#   ? Only the LEADER can write to _schemas topic
#   ? Followers forward write requests to the leader
#   ? Leader writes to _schemas ? followers consume and update in-memory state
#
# READ operations (get schema by ID, list subjects):
#   ? ANY instance can serve reads (from in-memory cache)
#   ? Load balancer can distribute reads across all instances
#
# LEADER ELECTION:
#   ? Uses a Kafka internal mechanism (writes to _schemas with NOOP key)
#   ? The instance that successfully writes the NOOP record is the leader
#   ? If leader dies ? another instance writes NOOP ? becomes new leader
#
#
# ???????????????????????????????????????????????????????????????????????????????
# 13. SCHEMA EVOLUTION DEMO ? Step-by-Step What Happens
# ???????????????????????????????????????????????????????????????????????????????
#
# STEP 1: Initial state (what we have now)
#   Schema V1: {orderId, customerId, productId, quantity, totalAmount, status}
#   Registered as ID=1, subject=order-events-avro-value, version=1
#
# STEP 2: Add a field WITH default (BACKWARD compatible ?)
#   Schema V2: adds {"name":"shippingAddress","type":["null","string"],"default":null}
#   ? Producer V2 registers schema ? Registry checks backward compatibility
#   ? V2 reader can read V1 data? ? shippingAddress not in V1 ? has default=null ? YES ?
#   ? Registered as ID=2, version=2
#
#   Now Kafka has:
#     Old messages (offset 0-99): schema ID=1 (6 fields)
#     New messages (offset 100+): schema ID=2 (7 fields)
#
#   Consumer V2 reads offset 50 (old message):
#     ? header says ID=1 ? fetch writer schema V1
#     ? V1 has 6 fields, V2 has 7 fields
#     ? resolution: 6 fields match by name, shippingAddress ? default null ?
#
#   Consumer V2 reads offset 150 (new message):
#     ? header says ID=2 ? same as reader schema ? direct read ?
#
#
# STEP 3: Try adding a field WITHOUT default (should be REJECTED ?)
#   Schema V3: adds {"name":"priority","type":"string"}   ? NO default!
#   ? Producer V3 tries to register
#   ? Registry checks: can V3 reader read V1 data?
#     ? priority not in V1, no default ? NO ?
#   ? HTTP 409 CONFLICT returned
#   ? serializer throws RestClientException
#   ? Message is NOT sent. Schema is NOT registered.
#   ? THIS IS THE SAFETY NET. Production is protected.
#
#
# STEP 4: Fix it ? add default
#   Schema V3: {"name":"priority","type":"string","default":"NORMAL"}
#   ? Registry checks: can V3 reader read V1 data?
#     ? priority not in V1, has default="NORMAL" ? YES ?
#   ? Registered as ID=3, version=3
#
#
# ???????????????????????????????????????????????????????????????????????????????
# 14. SCHEMA REGISTRY REST API ? Complete Reference
# ???????????????????????????????????????????????????????????????????????????????
#
# BASE URL: http://localhost:8085
#
# ??? SUBJECTS ???
#   GET  /subjects                                    ? list all subjects
#   GET  /subjects/{subject}/versions                 ? list versions
#   GET  /subjects/{subject}/versions/{version}       ? get specific version
#   GET  /subjects/{subject}/versions/latest           ? get latest version
#   POST /subjects/{subject}/versions                 ? register new schema
#        Body: {"schema": "{...}"}
#   POST /subjects/{subject}                          ? check if schema exists
#        Body: {"schema": "{...}"}
#   DELETE /subjects/{subject}/versions/{version}     ? soft delete version
#
# ??? SCHEMAS ???
#   GET  /schemas/ids/{id}                            ? get schema by global ID
#   GET  /schemas/types                               ? list supported types
#
# ??? COMPATIBILITY ???
#   POST /compatibility/subjects/{subject}/versions/{version}
#        ? test if schema is compatible with version
#        Body: {"schema": "{...}"}
#
# ??? CONFIG ???
#   GET  /config                                      ? get global compatibility
#   PUT  /config                                      ? set global compatibility
#        Body: {"compatibility": "BACKWARD"}
#   GET  /config/{subject}                            ? get subject compatibility
#   PUT  /config/{subject}                            ? set subject compatibility
#
#
# ???????????????????????????????????????????????????????????????????????????????
# 15. SCHEMA ID vs SCHEMA VERSION ? Common Confusion
# ???????????????????????????????????????????????????????????????????????????????
#
# These are TWO DIFFERENT numbers:
#
#   Schema VERSION:
#     ? Per-subject, sequential: 1, 2, 3, ...
#     ? subject "order-events-avro-value" has versions 1, 2, 3
#     ? subject "payment-events-avro-value" ALSO has versions 1, 2
#     ? Versions are SCOPED to a subject
#
#   Schema ID:
#     ? GLOBAL, unique across ALL subjects: 1, 2, 3, 4, 5, ...
#     ? "order-events-avro-value" version 1 ? ID=1
#     ? "order-events-avro-value" version 2 ? ID=2
#     ? "payment-events-avro-value" version 1 ? ID=3
#     ? This is what goes in the MESSAGE HEADER (5-byte prefix)
#
#   Example:
#     curl /subjects/order-events-avro-value/versions/1
#     ? {"subject":"order-events-avro-value","version":1,"id":1,"schema":"..."}
#                                            ^^^^^^^^      ^^^^
#                                            version       global ID
#                                            (per-subject) (in message header)
#
#
# ???????????????????????????????????????????????????????????????????????????????
# 16. SUMMARY ? Everything In One Glance
# ???????????????????????????????????????????????????????????????????????????????
#
#   ????????????????????????????????????????????????????????????????????????????
#   ?                    SCHEMA REGISTRY MENTAL MODEL                         ?
#   ????????????????????????????????????????????????????????????????????????????
#   ?                                                                          ?
#   ?  Producer                  Schema Registry             Consumer          ?
#   ?  ????????                  ???????????????              ????????          ?
#   ?  1. Build Avro object      Stores schemas              1. Read bytes     ?
#   ?  2. Extract schema         Assigns IDs                 2. Extract ID     ?
#   ?  3. Register/cache ID      Checks compatibility        3. Fetch schema   ?
#   ?  4. Serialize binary       Serves via REST API         4. Decode binary  ?
#   ?  5. Prepend [magic][ID]    Backed by _schemas topic    5. Map by name    ?
#   ?  6. Send to Kafka          HA: leader-follower         6. Fill defaults  ?
#   ?                                                                          ?
#   ????????????????????????????????????????????????????????????????????????????
#   ?  Wire Format:  [0x00] [4-byte schema ID] [Avro binary data]             ?
#   ?  Resolution:   Read by POSITION (writer), Map by NAME (reader)          ?
#   ?  Safety:       Compatibility check BEFORE publish, not after            ?
#   ?  Performance:  1 HTTP call per schema, then cached forever              ?
#   ????????????????????????????????????????????????????????????????????????????
#
